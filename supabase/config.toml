project_id = "priva-account-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
password_requirements = ""
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.sessions]
timebox = "2160h"
inactivity_timeout = "720h"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirma tu correo para Priva"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupera el acceso a Priva"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
enable_confirmations = true

[auth.rate_limit]
email_sent = 100
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
